[platformio]
default_envs = native

; ==========================================================
; Ambiente ESP32 (Hardware Real)
; ==========================================================
; Aditivo ao ambiente native. Não altera o desktop/mock.
; Para ativar: `pio run -e esp32dev`
; Requer a plataforma espressif32 instalada.
; ==========================================================
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -IC:\Users\Klebe\OneDrive\Desktop\BMSPC2\-bms\config

build_src_filter =
    +<*> -<main.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>
    +<hal/esp32/*>
    +<main_esp32.cpp>

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug
; Estrutura de testes compatível com o PlatformIO Test Framework.
; Os testes ficam em test/native/ e utilizam <unity.h>.
build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib

; TEST INFRAESTRUTURA (sprint TEST-INFRA-01): o test runner native do PlatformIO
; não compila/linka as bibliotecas de lib_extra_dirs (.a) nos executáveis de
; teste, causando "undefined reference" em todos os testes. Este hook customizado
; adiciona as fontes de produção (core/, system/, communication/, lib/) ao build
; de teste via SCons, resolvendo todos os símbolos sem duplicar código e sem
; alterar a arquitetura em camadas.
extra_scripts =
    pre:scripts/test_build_hook.py

build_src_filter =
    +<*> -<hal/esp32/*> -<main_esp32.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>

; ---- TEST INFRAESTRUTURA (SPRINT TEST-INFRA-01) ----
; O test runner do PlatformIO (native) compila apenas os arquivos em test/ e
; NÃO anexa as bibliotecas de lib_extra_dirs (.a) ao link dos executáveis de
; teste. Isso causava "undefined reference" em todos os testes (test_fault,
; test_self_test, test_storage) mesmo sem alteração de código.
;
; Solução INFRAESTRUTURA: expor explicitamente as bibliotecas locais via
; lib_deps (referenciando os nomes declarados em library.json). O LDF passa a
; resolver e anexar os arquivos .a ao link dos test executables, resolvendo
; todos os símbolos (FaultManager, FaultStorage, Logger, crc32, etc.) sem
; duplicar código, sem mocks e sem alterar a arquitetura em camadas.
lib_deps =
    bms-core
    bms-system
    bms-communication

; O test build reutiliza build_src_filter para compilar as fontes do projeto.
; Para que o PlatformIO Test Framework também compile e linke as fontes de
; core/, system/ e communication/ (que vivem fora de src/), esses diretórios
; são expostos como bibliotecas locais via library.json + lib_extra_dirs.
; Isso garante que pio test -e native resolva StorageManager, crc32, etc.
lib_extra_dirs =
    core
    system
    communication
    lib
