[platformio]
default_envs = native

; ==========================================================
; Ambiente ESP32 (Hardware Real)
; ==========================================================
; Aditivo ao ambiente native. Não altera o desktop/mock.
; Para ativar: `pio run -e esp32dev`
; Requer a plataforma espressif32 instalada.
; ==========================================================
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -IC:\Users\Klebe\OneDrive\Desktop\BMSPC2\-bms\config

build_src_filter =
    +<*> -<main.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>
    +<hal/esp32/*>
    +<main_esp32.cpp>

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug
; Estrutura de testes compatível com o PlatformIO Test Framework.
; Os testes ficam em test/native/ e utilizam <unity.h>.
build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib

build_src_filter =
    +<*> -<hal/esp32/*> -<main_esp32.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>

; O test build reutiliza build_src_filter para compilar as fontes do projeto.
; Para que o PlatformIO Test Framework também compile e linke as fontes de
; core/, system/ e communication/ (que vivem fora de src/), esses diretórios
; são expostos como bibliotecas locais via library.json + lib_extra_dirs.
; Isso garante que pio test -e native resolva StorageManager, crc32, etc.
lib_extra_dirs =
    core
    system
    communication
    lib
