[platformio]
default_envs = native

; ==========================================================
; Ambiente nativo (desktop/mock) — BUILD e TEST
; ==========================================================
[env:native]
platform = native
build_type = debug
test_framework = unity

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -Isrc
    -Iconfig

; Apenas fontes da aplicação (sem main_esp32 e HAL esp32).
build_src_filter =
    +<*> -<hal/esp32/*> -<main_esp32.cpp>

; Folhas de estilo/teste: fontes de produção são adicionadas via
; scripts/test_build_hook.py no build de teste nativo (mecanismo correto).
; Os módulos locais (core/system/communication/lib) são encontrados via
; lib_extra_dirs e NÃO devem ser declarados como lib_deps externos.
lib_extra_dirs =
    core
    system
    communication
    lib
    tools/bms_endurance

; Hook SCons: adiciona as fontes de produção ao build de teste native.
extra_scripts =
    pre:scripts/test_build_hook.py

; ==========================================================
; Ambiente ESP32 (hardware real)
; Requer a plataforma espressif32 instalada.
; ==========================================================
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -Isrc
    -Iconfig

build_src_filter =
    +<*> -<main.cpp> -<hal/adc/*> -<hal/current/*> -<hal/temperature/*>
    +<hal/esp32/*>
    +<main_esp32.cpp>

lib_extra_dirs =
    core
    system
    communication
    lib

; Bibliotecas externas reais do ESP32 (registry).
lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

