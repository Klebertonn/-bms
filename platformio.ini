[platformio]
default_envs = native

; ==========================================================
; Ambiente ESP32 (Hardware Real)
; ==========================================================
; Aditivo ao ambiente native. Não altera o desktop/mock.
; Para ativar: `pio run -e esp32dev`
; Requer a plataforma espressif32 instalada.
; ==========================================================
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -IC:\Users\Klebe\OneDrive\Desktop\BMSPC2\-bms\config

build_src_filter =
    +<*> -<main.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>
    +<hal/esp32/*>
    +<main_esp32.cpp>

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug
; Estrutura de testes compatível com o PlatformIO Test Framework.
; Os testes ficam em test/native/ e utilizam <unity.h>.
build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -Iconfig

; =====================================================================
; TEST INFRAESTRUTURA (SPRINT TEST-INFRA-01)
; =====================================================================
; PROBLEMA ORIGINAL:
; O test runner native do PlatformIO compila apenas os arquivos em test/
; e NÃO linka as bibliotecas .a de lib_extra_dirs/lib_deps nos executáveis
; de teste, causando "undefined reference" em todos os testes (test_fault,
; test_self_test, test_storage) para símbolos de produção (FaultManager,
; FaultRegistry, ProtectionManager, SelfTest, StorageManager, crc32, etc.).
;
; SOLUÇÃO:
; O hook customizado scripts/test_build_hook.py adiciona as fontes de
; produção (core/, system/, communication/, lib/) ao build de teste via
; SCons, resolvendo todos os símbolos sem duplicar código e sem alterar a
; arquitetura em camadas.
;
; Isso:
;   - Resolve todos os símbolos de produção nos testes.
;   - Não modifica o código de produção (core/, system/, communication/, lib/).
;   - Não altera FaultManager / ProtectionManager / FaultStorage.
;   - Não desabilita testes nem ignora símbolos indefinidos.
;   - Não duplica símbolos (o hook adiciona apenas as fontes, sem .a duplicados).
;   - Usa apenas caminhos relativos ao projeto.
; =====================================================================

; Hook SCons que adiciona as fontes de produção ao build de teste.
extra_scripts =
    pre:scripts/test_build_hook.py

; Determina quais fontes entram no BUILD principal (pio run).
build_src_filter =
    +<*> -<hal/esp32/*> -<main_esp32.cpp>
    +<../core/>
    +<../system/>
    +<../communication/>

; ---- TEST INFRAESTRUTURA (SPRINT TEST-INFRA-01) ----
; Bibliotecas locais (para o build principal pio run).
lib_deps =
    bms-core
    bms-system
    bms-communication

; Diretórios de bibliotecas locais (library.json).
lib_extra_dirs =
    core
    system
    communication
    lib
