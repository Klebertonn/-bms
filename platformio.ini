[platformio]
default_envs = native

; ==========================================================
; Ambiente ESP32 (Hardware Real)
; ==========================================================
; Aditivo ao ambiente native. Não altera o desktop/mock.
; Para ativar: `pio run -e esp32dev`
; Requer a plataforma espressif32 instalada.
; ==========================================================
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib
    -IC:\Users\Klebe\OneDrive\Desktop\BMSPC2\-bms\config

build_src_filter =
    +<*> -<main.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>
    +<hal/esp32/*>
    +<main_esp32.cpp>

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

[env]
test_framework = unity

[env:native]
platform = native
build_type = debug

build_flags =
    -I.
    -Icore
    -Isystem
    -Icommunication
    -Ilib

build_src_filter =
    +<*>
    -<hal/esp32/*>
    -<main_esp32.cpp>
    +<../core/*>
    +<../system/*>
    +<../communication/*>

test_build_src_filter =
    +<*>
    +<../core/*>
    +<../system/*>
    +<../communication/*>
    +<../core/state/*>
    +<../core/fault/*>
    +<../core/battery/*>
    +<../core/mosfet/*>
    +<../system/heartbeat/*>
    +<../system/clock/*>
    +<../system/rtos/*>
